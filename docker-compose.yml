services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_signals}
      POSTGRES_USER: ${POSTGRES_USER:-customer_signals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customer_signals} -d ${POSTGRES_DB:-customer_signals}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-customer-signals.example.com},localhost,127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-customer_signals}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-customer_signals}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'X-Forwarded-Proto':'https'}), timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py migrate --noinput && python manage.py setup_roles && exec celery -A customer360 worker --loglevel=INFO --concurrency=2"]
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-customer-signals.example.com},localhost,127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-customer_signals}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-customer_signals}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_healthy}
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py migrate --noinput && exec celery -A customer360 beat --loglevel=INFO --schedule=/tmp/customer-signals-beat.db"]
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-customer-signals.example.com},localhost,127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-customer_signals}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-customer_signals}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      web: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
